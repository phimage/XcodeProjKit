name: SwiftLint

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - '.github/workflows/swiftlint.yml'
      - '.swiftlint.yml'
      - '**/*.swift'

jobs:
  SwiftLint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging
